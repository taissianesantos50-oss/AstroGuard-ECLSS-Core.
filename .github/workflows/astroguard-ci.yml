name: AstroGuard CI

on:
  push:
    branches:
      - main
      - v1.4-human-health-monitoring
      - v1.9-advanced-mission-health-analytics
      - 'fix/**'
  pull_request:
    branches:
      - main
      - v1.9-advanced-mission-health-analytics
  workflow_dispatch:

jobs:
  c-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile health monitor unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            src/health_monitor.c tests/test_health_monitor.c \
            -I src -o test_health_monitor

      - name: Run health monitor unit tests
        run: ./test_health_monitor

      - name: Compile v1.9 analytics unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            src/mission_health_analytics.c tests/test_mission_health_analytics.c \
            -I src -lm -o test_mission_health_analytics

      - name: Run v1.9 analytics unit tests
        run: ./test_mission_health_analytics

      - name: Compile v1.4 baseline simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            src/health_monitor.c src/astroguard_v1_4.c \
            -I src -o astroguard_v1_4

      - name: Run v1.4 baseline simulation
        run: ./astroguard_v1_4

      - name: Verify v1.4 telemetry artifact
        run: |
          test -f telemetry_v1_4.csv
          test "$(wc -l < telemetry_v1_4.csv)" -eq 22
          grep -q ",NORMAL$" telemetry_v1_4.csv
          grep -q ",ATTENTION$" telemetry_v1_4.csv
          grep -q ",CRITICAL$" telemetry_v1_4.csv

      - name: Compile v1.9 integrated analytics simulation
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            src/health_monitor.c src/mission_health_analytics.c src/astroguard_v1_9.c \
            -I src -lm -o astroguard_v1_9

      - name: Run v1.9 integrated analytics simulation
        run: ./astroguard_v1_9

      - name: Verify v1.9 telemetry and analytics outputs
        run: |
          test -f telemetry_v1_9.csv
          test -f mission_health_analytics_v1_9.csv
          test "$(wc -l < telemetry_v1_9.csv)" -eq 22
          test "$(wc -l < mission_health_analytics_v1_9.csv)" -eq 2
          grep -q ",NORMAL$" telemetry_v1_9.csv
          grep -q ",ATTENTION$" telemetry_v1_9.csv
          grep -q ",CRITICAL$" telemetry_v1_9.csv
          grep -q ",DEGRADING$" mission_health_analytics_v1_9.csv

  python-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile src/astroguard_v1_5.py

      - name: Verify dashboard assets and DOM targets
        run: python spaceapps_2026/check_dashboard_assets.py
